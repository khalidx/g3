name: CLI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

jobs:

  test-cli:
    name: Test CLI (${{ matrix.os.github.os }})
    runs-on: ${{ matrix.os.github.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { github: { os: 'ubuntu-latest'  }, bun: { target: 'bun-linux-x64',   outfile: 'exec/g3-linux-x64',   name: 'g3-linux-x64'       } }
          - { github: { os: 'macos-latest'   }, bun: { target: 'bun-darwin-x64',  outfile: 'exec/g3-darwin-x64',  name: 'g3-darwin-x64'      } }
          - { github: { os: 'windows-latest' }, bun: { target: 'bun-windows-x64', outfile: 'exec/g3-windows-x64', name: 'g3-windows-x64.exe' } }
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun run tsc --noEmit

      - name: Build binary
        run: bun run build:binaries -- --target=${{ matrix.os.bun.target }} --outfile=${{ matrix.os.bun.outfile }}

      - name: Run (bun)
        run: bun run src/index.ts -- --version

      - name: Run (binary)
        run: ./exec/${{ matrix.os.bun.name }} --version

      - name: Run (bin)
        run: ./bin/g3 --version

      - name: Run (installed)
        run: |
          ./bin/g3 install
          g3 --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os.bun.name }}
          path: exec/${{ matrix.os.bun.name }}
          if-no-files-found: error
          retention-days: 1
