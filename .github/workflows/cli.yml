name: CLI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

permissions:
  contents: write

jobs:

  test-cli:
    name: Test CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun run tsc --noEmit

      - name: Build binaries
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:binaries

      - name: Upload artifacts (linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: g3-linux-x64
          path: exec/g3-linux-x64
          if-no-files-found: error
        
      - name: Upload artifacts (mac)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: g3-darwin-x64
          path: exec/g3-darwin-x64
          if-no-files-found: error

      - name: Upload artifacts (windows)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: g3-windows-x64.exe
          path: exec/g3-windows-x64.exe
          if-no-files-found: error
